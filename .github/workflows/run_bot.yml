name: AI YouTube Bot Runner

on:
  push:
    branches:
      - main
  schedule:
    # 3x per week only — daily uploads get flagged as spam by YouTube algorithm
    # IST 9:00 AM = UTC 3:30 AM, runs Mon / Wed / Fri
    - cron: '30 3 * * 1'   # Monday    9:00 AM IST
    - cron: '30 3 * * 3'   # Wednesday 9:00 AM IST
    - cron: '30 3 * * 5'   # Friday    9:00 AM IST
  workflow_dispatch:
    inputs:
      topic:
        description: 'Custom topic (leave empty for auto-research)'
        required: false
        default: ''
      dry_run:
        description: 'Dry run? true = generate video but skip YouTube upload'
        required: false
        default: 'false'
      mode:
        description: 'Mode: both / long_only / shorts_only'
        required: false
        default: 'both'

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libfreetype6-dev libfontconfig1-dev libssl-dev > /dev/null
          sudo apt-get install -y ffmpeg fonts-liberation fonts-open-sans > /dev/null
          ffmpeg -filters 2>/dev/null | grep drawtext && echo "✅ drawtext OK" || echo "⚠️ drawtext missing"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip --quiet
          pip install -r requirements.txt --quiet

      - name: Write YouTube Token
        run: |
          mkdir -p config
          printf '%s' "$YOUTUBE_TOKEN_JSON" > config/token.json
          python -c "import json,sys; json.load(open('config/token.json'))" && echo "✅ token.json valid" || echo "⚠️ token.json invalid"
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}

      - name: Refresh YouTube Token
        run: |
          python - <<'EOF'
          import json, os
          from google.oauth2.credentials import Credentials
          from google.auth.transport.requests import Request

          SCOPES = ["https://www.googleapis.com/auth/youtube.upload", "https://www.googleapis.com/auth/youtube"]
          TOKEN_FILE = "config/token.json"

          try:
              creds = Credentials.from_authorized_user_file(TOKEN_FILE, SCOPES)
              if creds.expired and creds.refresh_token:
                  print("Token expired - refreshing...")
                  creds.refresh(Request())
                  with open(TOKEN_FILE, "w") as f:
                      f.write(creds.to_json())
                  print("✅ Token refreshed!")
              elif creds.valid:
                  print("✅ Token is valid.")
              else:
                  print("⚠️ Token cannot be refreshed!")
          except Exception as e:
              print(f"❌ Token refresh failed: {e}")
          EOF

      - name: Run Bot
        timeout-minutes: 140
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GOOGLE_SEARCH_API_KEY: ${{ secrets.GOOGLE_SEARCH_API_KEY }}
          GOOGLE_SEARCH_ENGINE_ID: ${{ secrets.GOOGLE_SEARCH_ENGINE_ID }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          PLAYHT_USER_ID: ${{ secrets.PLAYHT_USER_ID }}
          PLAYHT_API_KEY: ${{ secrets.PLAYHT_API_KEY }}
          FAL_API_KEY: ${{ secrets.FAL_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          TOPIC_FLAG=""
          DRY_FLAG=""
          MODE_FLAG=""

          if [ -n "${{ github.event.inputs.topic }}" ]; then
            TOPIC_FLAG="--topic \"${{ github.event.inputs.topic }}\""
          fi

          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            DRY_FLAG="--dry-run"
            echo "🧪 DRY RUN — generating video without uploading"
          fi

          MODE="${{ github.event.inputs.mode }}"
          if [ "$MODE" = "long_only" ]; then
            MODE_FLAG="--long-only"
            echo "📹 Long video only"
          elif [ "$MODE" = "shorts_only" ]; then
            MODE_FLAG="--shorts-only"
            echo "📱 Shorts only"
          else
            echo "📹📱 Both Long + Shorts"
          fi

          eval python main.py $DRY_FLAG $MODE_FLAG $TOPIC_FLAG

      - name: Upload Output Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bot-output-${{ github.run_number }}
          path: output/
          retention-days: 7

      - name: Commit Topic History
        if: success()
        run: |
          git config --global user.name "AI YouTube Bot"
          git config --global user.email "bot@youtube-ai.com"
          git add output/topic_history.json 2>/dev/null || true
          git commit -m "Auto-update topic history [skip ci]" 2>/dev/null || echo "No changes to commit"
          git push origin main 2>/dev/null || echo "Push failed (no changes)"
